spring.application.name=end_of_term

server.port=8080

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/end_of_term?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
# 数据库凭据支持环境变量覆盖：DB_USERNAME / DB_PASSWORD
# 默认值仅用于本地开发（MySQL 默认 root/123456），生产部署请务必用环境变量注入
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.end_of_term.entity
mybatis.configuration.map-underscore-to-camel-case=true

logging.level.com.example.end_of_term=debug

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

file.upload-dir=uploads
